name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint (error memblokir, warning terlihat di log)
        run: npm run lint

  verify:
    name: Build, typecheck & unit test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Next.js 16 tidak lagi lint saat build, dan build yang menghasilkan
      # next-env.d.ts + route types — jadi build dulu, typecheck sesudahnya.
      - name: Build produksi
        run: npm run build
      - name: Typecheck (strict)
        run: npm run typecheck
      - name: Unit test
        run: npm run test