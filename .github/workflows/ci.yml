name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # WAJIB terpisah: Next.js 16 tidak lagi lint saat build.
      - name: Lint
        run: npm run lint

      # next build tetap menjalankan type-check.
      - name: Build
        run: npm run build

      # Typecheck eksplisit setelah build (next-env.d.ts & route types sudah dibuat).
      - name: Typecheck
        run: npm run typecheck